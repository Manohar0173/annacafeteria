<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anna Cafeteria - Test</title>
    <!-- Connect to our design file -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- 1. THE LOGIN FORM SCREEN -->
        <div id="login-screen">
            <h2>☕ Anna Cafeteria Login</h2>
            <input type="password" id="passcode-input" placeholder="Enter Passcode...">
            <button onclick="checkLogin()">Enter App</button>
            <p id="login-error" style="color: red; font-weight: bold;"></p>
        </div>

        <!-- 2. THE SUCCESS SCREEN (Hidden by default) -->
        <div id="success-screen" style="display: none;">
            <h2>🎉 Logged in successfully!</h2>
            <p>Your login routing is working perfectly.</p>
            <button onclick="logout()">Logout</button>
        </div>
    </div>

    <!-- Connect to our logic brain file -->
    <script src="app.js"></script>
</body>
</html>
