<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anna Cafeteria</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Browser-compatible Firebase Scripts -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
</head>
<body>
    <div id="app">
        <!-- Login Screen -->
        <div id="login-screen" class="card">
            <h2>☕ Anna Cafeteria Login</h2>
            <p>Enter the office passcode to view today's snacks</p>
            <input type="password" id="passcode-input" placeholder="Enter Passcode...">
            <button onclick="checkLogin()">Enter App</button>
            <p id="login-error" class="error"></p>
        </div>

        <!-- User/Client Screen -->
        <div id="user-screen" class="hidden">
            <header style="display: flex; justify-content: space-between; align-items: center;">
                <h2>👋 Office Snacks Menu</h2>
                <button class="btn-secondary" onclick="logout()">Logout</button>
            </header>
            <div id="menu-container"></div>
            <hr>
            <h3>⏳ Your Orders Today</h3>
            <div id="user-orders"></div>
        </div>

        <!-- Admin/Kitchen Screen -->
        <div id="admin-screen" class="hidden">
            <header style="display: flex; justify-content: space-between; align-items: center;">
                <h2>👨‍🍳 Kitchen Dashboard</h2>
                <button class="btn-secondary" onclick="logout()">Logout</button>
            </header>
            
            <div class="card">
                <h3>📢 Today's Menu Control</h3>
                <p>Toggle items to show/hide them on the employee menu:</p>
                <div id="chef-menu-toggle-container"></div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3>📥 Active Incoming Orders</h3>
                <button class="btn-danger" onclick="clearAllOrders()">Clear Order History</button>
            </div>
            <div id="admin-orders"></div>
        </div>
    </div>

    <!-- Explicit scope bindings for GitHub Pages deployment -->
    <script src="app.js"></script>
</body>
</html>
